async function loadS(k,fb){try{const r=await window.storage.get(k);return r?JSON.parse(r.value):fb;}catch{return fb;}}
async function saveS(k,d){try{await window.storage.set(k,JSON.stringify(d));}catch{}}

async function callAI(prompt){
  try{
    const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,messages:[{role:"user",content:prompt}]})});
    const d=await r.json();
    if(d.error)return"ERR:"+d.error.message;
    return d.content?.[0]?.text||"";
  }catch(e){return"ERR:"+e.message;}
}

function fmtWA(p){return[`🏢 *${p.name}*`,`📍 ${p.loc}, ${p.region}`,``,`💰 *Price: ${p.price}*${p.priceSqYd?`  |  ${p.priceSqYd}`:""}`,`📐 ${p.size||"—"}${p.facing?`  |  ${p.facing} Facing`:""}`,`🏗️ ${p.status}`,p.dev?`🏛️ ${p.dev}`:null,p.landmark?`📌 Near: ${p.landmark}`:null,``,p.amenities?.length?`✅ ${p.amenities.join(", ")}`:null,p.rera?`🔖 RERA: ${p.rera}`:null,(p.contact||p.phone)?`📞 ${[p.contact,p.phone].filter(Boolean).join(" · ")}`:null,``,`_Shared by Real-X Hyderabad CRM_`].filter(v=>v!==null).join("\n");}
function fmtMultiWA(props,note=""){return`🏆 *Real-X Hyderabad*\n${note?`📋 ${note}\n`:""}\n`+props.map((p,i)=>`━━━━━━━━━━\n${i+1}. *${p.name}*\n📍 ${p.loc}  💰 ${p.price}\n🏗️ ${p.status}  📐 ${p.size||"—"}\n${(p.contact||p.phone)?`📞 ${[p.contact,p.phone].filter(Boolean).join(" · ")}`:""}`.trim()).join("\n\n")+"\n\n_Real-X Hyderabad CRM_";}
function openWA(text,phone=""){window.open(phone?`https://wa.me/${phone.replace(/\D/g,"")}?text=${encodeURIComponent(text)}`:`https://wa.me/?text=${encodeURIComponent(text)}`,"_blank");}

  const mType=(p,type)=>{if(!type)return true;const t=type.toLowerCase(),pt=(p.type||"").toLowerCase();if(t.includes("plot"))return pt.includes("plot");if(t.includes("villa"))return pt.includes("villa");if(t.includes("1bhk"))return pt.includes("1bhk");if(t.includes("2bhk"))return pt.includes("2bhk");if(t.includes("3bhk"))return pt.includes("3bhk");if(t.includes("4bhk"))return pt.includes("4bhk");if(t.includes("apartment")||t.includes("flat"))return pt.includes("apartment");if(t.includes("commercial"))return pt.includes("commercial");if(t.includes("farmland"))return pt.includes("farmland");return true;};
  const search=async()=>{
    if(!q.trim())return;
    if(properties.length===0){setErr("⚠️ No properties in database yet. Add properties first.");return;}
    setLoading(true);setRes(null);setErr("");
    const raw=await callAI(`Parse this Hyderabad real estate requirement. Return ONLY valid JSON (no markdown):\n\n"${q}"\n\n{"location":"area name or null","propertyType":"Open Plots / Apartment 1BHK / Apartment 2BHK / Apartment 3BHK / Apartment 4BHK / Villa / Commercial / Farmland / null","budgetMax":"e.g. 90L or 1.2Cr or null","nearbyAreas":["5 real nearby Hyderabad areas if this location has no results"],"summary":"one line of what customer wants"}`);
    if(raw.startsWith("ERR:")){setErr("⚠️ AI error: "+raw.slice(4));setLoading(false);return;}
    let req={};
    try{const m=raw.replace(/```json|```/g,"").trim().match(/\{[\s\S]*\}/);if(m)req=JSON.parse(m[0]);}catch{}
    const loc=(req.location||"").toLowerCase().trim();
    const type=(req.propertyType||"").toLowerCase().trim();
    const nearby=req.nearbyAreas||[];
    const exact=properties.filter(p=>mLoc(p,loc)&&mType(p,type));
    const sameArea=properties.filter(p=>mLoc(p,loc)&&!mType(p,type)&&!exact.find(e=>e.id===p.id));
    const sameType=properties.filter(p=>!mLoc(p,loc)&&mType(p,type)&&!exact.find(e=>e.id===p.id));
    const nearbyProps=properties.filter(p=>{const inN=nearby.some(n=>(p.loc+p.region+(p.landmark||"")).toLowerCase().includes(n.toLowerCase()));return inN&&!exact.find(e=>e.id===p.id)&&!sameArea.find(e=>e.id===p.id)&&!sameType.find(e=>e.id===p.id);});
    setRes({req,loc:req.location||"",type:req.propertyType||"",summary:req.summary||q,exact,sameArea,sameType:sameType.slice(0,6),nearby:nearbyProps.slice(0,6),nearbyAreas:nearby});
    setLoading(false);
  };
  return(
    <div>
      <div style={{marginBottom:18}}><div style={{fontSize:20,fontWeight:700,color:C.text,fontFamily:"'Cormorant Garamond',serif"}}>AI Property Search</div><div style={{fontSize:12,color:C.sub,marginTop:3}}>Results shown as shareable property cards — no paragraphs</div></div>
      <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:"14px 17px",marginBottom:12}}>
        <div style={{fontSize:10,color:C.gold,textTransform:"uppercase",letterSpacing:"1.5px",marginBottom:7}}>Customer Requirement</div>
        <textarea value={q} onChange={e=>setQ(e.target.value)} placeholder='Type what your customer wants... e.g. "3BHK in Kondapur under 90 lakhs" or "investment plots near ORR"' style={{...INP,height:65,resize:"none",lineHeight:1.5}} onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();search();}}}/>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:9}}>
          <span style={{fontSize:11,color:C.sub}}>Quick examples:</span>
          <button onClick={search} disabled={loading} style={{background:loading?`${C.gold}35`:C.gold,color:"#050810",border:"none",borderRadius:8,padding:"9px 22px",fontSize:12,fontWeight:700,cursor:loading?"default":"pointer"}}>{loading?"🔍 Searching...":"🤖 Search with AI"}</button>
        </div>
        <div style={{display:"flex",flexWrap:"wrap",gap:6,marginTop:8}}>{exs.map(ex=><button key={ex} onClick={()=>setQ(ex)} style={{background:"transparent",border:`1px solid ${C.border}`,color:C.sub,borderRadius:20,padding:"4px 10px",fontSize:11,cursor:"pointer"}}>{ex}</button>)}</div>
      </div>
      {err&&<div style={{background:`${C.red}10`,border:`1px solid ${C.red}22`,borderRadius:9,padding:"11px 14px",marginBottom:12,fontSize:12,color:C.red}}>{err}</div>}
      {loading&&<div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:"28px 20px",textAlign:"center"}}><div style={{fontSize:26,marginBottom:8}}>🧠</div><div style={{fontSize:13,color:C.gold,fontWeight:600,marginBottom:3}}>Searching {properties.length} properties...</div><div style={{fontSize:12,color:C.sub}}>Finding matches · Checking nearby areas · Preparing cards</div></div>}
      {res&&!loading&&(
        <div>
          {res.exact.length>0
            ?<div style={{background:`${C.green}10`,border:`1px solid ${C.green}25`,borderRadius:10,padding:"11px 14px",marginBottom:18,display:"flex",alignItems:"center",gap:9}}><span style={{fontSize:18}}>✅</span><div><div style={{fontSize:13,fontWeight:600,color:C.green}}>Found {res.exact.length} matching {res.type||"properties"}{res.loc?` in ${res.loc}`:""}</div><div style={{fontSize:11,color:C.sub,marginTop:1}}>{res.summary}</div></div></div>
            :<div style={{background:`${C.amber}08`,border:`1px solid ${C.amber}25`,borderRadius:10,padding:"13px 15px",marginBottom:18}}>
              <div style={{fontSize:13,fontWeight:600,color:C.amber,marginBottom:4}}>😔 Sorry sir, we currently don't have {res.type||"properties"}{res.loc?` in ${res.loc}`:""} in our inventory.</div>
              {(res.sameArea.length>0||res.sameType.length>0||res.nearby.length>0)?<div style={{fontSize:12,color:C.sub}}>But here are the best alternatives we can offer right now 👇</div>:<div style={{fontSize:12,color:C.sub}}>No matching inventory right now. Check back after adding more properties.</div>}
              {res.nearbyAreas?.length>0&&<div style={{fontSize:11,color:C.sub,marginTop:5}}>📍 Nearby areas to explore: {res.nearbyAreas.slice(0,4).join(", ")}</div>}
            </div>
          }
          {res.exact.length>0&&<SrchSection title="✅ Best Matches" color={C.green} props={res.exact} leads={leads} note={res.summary}/>}
          {res.sameArea.length>0&&<SrchSection title={`📍 Also in ${res.loc||"this area"} (different type)`} color={C.amber} props={res.sameArea} leads={leads} note={`Properties in ${res.loc}`}/>}
          {res.sameType.length>0&&<SrchSection title={`🏢 ${res.type||"Similar"} in other areas`} color={C.blue} props={res.sameType} leads={leads} note={`${res.type} options`}/>}
          {res.nearby.length>0&&<SrchSection title="🗺️ Nearby Area Options" color={C.purple} props={res.nearby} leads={leads} note="Nearby alternatives"/>}
          {res.exact.length===0&&res.sameArea.length===0&&res.sameType.length===0&&res.nearby.length===0&&(
            <div style={{textAlign:"center",padding:"36px 20px",background:C.card,border:`1px solid ${C.border}`,borderRadius:12}}>
              <div style={{fontSize:30,marginBottom:10}}>🏗️</div>
              <div style={{fontSize:13,color:C.text,fontWeight:600,marginBottom:6}}>No inventory found for this requirement</div>
              <div style={{fontSize:12,color:C.sub,lineHeight:1.7,marginBottom:12}}>Add properties from the WhatsApp Bot or Properties tab and they will show up here.</div>
              <div style={{fontSize:11,color:C.gold}}>Try sourcing from: {(res.nearbyAreas||[]).join(", ")||"Kokapet, Tellapur, Narsingi, Financial District"}</div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

              <div style={{marginBottom:9}}><div style={LBL}>Budget</div><input style={INP} value={nBudget} onChange={e=>setNBudget(e.target.value)}/></div>

            </div>:<div>
              <div style={{fontSize:13,color:C.text,fontWeight:500,marginBottom:4}}>{lead.req||"No requirement set"}</div>
              <div style={{fontSize:12,color:C.gold}}>💰 {lead.budget||"Budget not specified"}</div>
              {lead.notes&&<div style={{fontSize:11,color:C.sub,marginTop:5}}>📝 {lead.notes}</div>}
            </div>}
          </div>
          {(lead.reqHistory||[]).length>0&&<div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:9,padding:"11px 13px"}}>
            <div style={{fontSize:11,fontWeight:600,color:C.sub,textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:8}}>Requirement History</div>
            {(lead.reqHistory||[]).map((h,i)=><div key={i} style={{display:"flex",gap:9,marginBottom:7,paddingBottom:7,borderBottom:i<(lead.reqHistory||[]).length-1?`1px solid ${C.border}`:"none"}}>
              <div style={{width:6,height:6,borderRadius:"50%",background:i===0?C.gold:C.dim,marginTop:5,flexShrink:0}}/>
              <div style={{flex:1}}><div style={{fontSize:12,color:i===0?C.text:C.sub}}>{h.req}</div><div style={{fontSize:11,color:C.sub}}>{h.budget} · {h.date}</div></div>
              {i===0&&<Pill label="Current" color={C.gold}/>}
            </div>)}
          </div>}
        </div>}
        {/* PROPERTIES SENT */}
        {tab==="properties"&&<div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:11}}>
            <div style={{fontSize:12,color:C.sub}}>{(lead.propsSent||[]).length} properties sent</div>
            {!isClosed&&<button onClick={()=>setShowPicker(true)} style={{background:`${C.gold}12`,border:`1px solid ${C.gold}28`,color:C.gold,borderRadius:7,padding:"5px 12px",fontSize:11,cursor:"pointer",fontWeight:600}}>🏠 Send Property</button>}
          </div>
          {(lead.propsSent||[]).length===0?<div style={{textAlign:"center",padding:"28px 20px",background:C.card,border:`1px solid ${C.border}`,borderRadius:9}}>
            <div style={{fontSize:22,marginBottom:7}}>🏘️</div><div style={{fontSize:12,color:C.sub,marginBottom:9}}>No properties sent yet</div>
            {!isClosed&&<button onClick={()=>setShowPicker(true)} style={{background:C.gold,border:"none",color:"#050810",borderRadius:7,padding:"7px 16px",fontSize:12,fontWeight:700,cursor:"pointer"}}>Send First Property</button>}
          </div>:(lead.propsSent||[]).map((ps,i)=>{const prop=properties.find(p=>p.id===ps.propId);return(
            <div key={i} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:8,padding:"10px 12px",marginBottom:7,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div><div style={{fontSize:12,fontWeight:600,color:C.text}}>{ps.propName}</div><div style={{fontSize:10,color:C.sub}}>Sent {fmtT(ps.sentAt)}</div>{prop&&<div style={{fontSize:11,color:C.gold,marginTop:2}}>{prop.price} · {prop.loc}</div>}</div>
              {prop&&<button onClick={()=>openWA(fmtWA(prop),lead.phone)} style={{background:`${C.wa}15`,border:`1px solid ${C.wa}28`,color:C.wa,borderRadius:7,padding:"5px 9px",fontSize:10,cursor:"pointer",fontWeight:600}}>📤 Resend</button>}
            </div>
          );})}
          {showPicker&&<div style={{marginTop:11,background:C.bg,border:`1px solid ${C.border}`,borderRadius:9,padding:"12px 13px"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:9}}><div style={{fontSize:12,fontWeight:600,color:C.text}}>Select Property to Send</div><button onClick={()=>setShowPicker(false)} style={{background:"transparent",border:"none",color:C.sub,cursor:"pointer",fontSize:15}}>✕</button></div>
            <input value={pSrch} onChange={e=>setPSrch(e.target.value)} placeholder="Search properties..." style={{...INP,marginBottom:9}}/>
            <div style={{maxHeight:190,overflowY:"auto",display:"flex",flexDirection:"column",gap:6}}>{fp.map(p=><div key={p.id} style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:7,padding:"9px 11px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div><div style={{fontSize:12,fontWeight:600,color:C.text}}>{p.name}</div><div style={{fontSize:11,color:C.sub}}>📍 {p.loc} · {p.price}</div></div>
              <button onClick={()=>sendProp(p)} style={{background:C.gold,border:"none",color:"#050810",borderRadius:7,padding:"5px 11px",fontSize:11,fontWeight:700,cursor:"pointer"}}>Send 📤</button>
            </div>)}{fp.length===0&&<div style={{fontSize:12,color:C.sub,textAlign:"center",padding:"18px"}}>No properties found</div>}</div>
          </div>}
        </div>}
        {/* TIMELINE */}
        {tab==="timeline"&&<div>
          {!isClosed&&<div style={{marginBottom:13}}>
            <div style={{display:"flex",gap:7,marginBottom:8}}>
              <input value={note} onChange={e=>setNote(e.target.value)} onKeyDown={e=>e.key==="Enter"&&saveNote()} placeholder="Add a note... (e.g. customer called, budget flexible, wants site visit)" style={{...INP,flex:1}}/>
              <button onClick={saveNote} disabled={!note.trim()} style={{background:note.trim()?C.teal:`${C.teal}28`,border:"none",color:note.trim()?"#050810":C.dim,borderRadius:7,padding:"9px 13px",fontSize:12,fontWeight:700,cursor:note.trim()?"pointer":"default"}}>+ Note</button>
            </div>
            <div style={{display:"flex",gap:6}}>{[["📞 Called",{type:"call",text:`Called ${lead.name}`}],["💬 WhatsApp",{type:"whatsapp",text:`WhatsApp message sent to ${lead.name}`}]].map(([label,act])=><button key={label} onClick={()=>addAct(act.type,act.text)} style={{background:`${C.blue}10`,border:`1px solid ${C.blue}20`,color:C.blue,borderRadius:7,padding:"5px 11px",fontSize:11,cursor:"pointer"}}>{label}</button>)}</div>
          </div>}
          {(lead.activities||[]).length===0?<div style={{textAlign:"center",padding:"28px",color:C.sub,fontSize:12}}>No activity yet.</div>:(lead.activities||[]).map((act,i)=>(
            <div key={act.id||i} style={{display:"flex",gap:9,marginBottom:11,paddingBottom:11,borderBottom:i<(lead.activities||[]).length-1?`1px solid ${C.border}`:"none"}}>
              <div style={{width:28,height:28,borderRadius:"50%",background:`${aColors[act.type]||C.sub}18`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,flexShrink:0}}>{aIcons[act.type]||"•"}</div>
              <div style={{flex:1}}><div style={{fontSize:12,color:C.text,lineHeight:1.4}}>{act.text}</div>{act.propName&&<div style={{fontSize:11,color:C.gold,marginTop:2}}>🏢 {act.propName}</div>}<div style={{fontSize:10,color:C.sub,marginTop:3}}>{fmtT(act.time)}</div></div>
            </div>
          ))}
        </div>}
        {/* ACTIONS */}
        {tab==="actions"&&<div>
          {!isClosed&&<div>
            <div style={{fontSize:11,color:C.sub,textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:9}}>Change Status</div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:7,marginBottom:16}}>
              {["Hot","Warm","Cold"].map(s=><button key={s} onClick={()=>setStatus(s)} style={{background:lead.status===s?`${LSTAT_COL[s]}18`:`${LSTAT_COL[s]}08`,border:`1px solid ${LSTAT_COL[s]}${lead.status===s?"40":"20"}`,color:LSTAT_COL[s],borderRadius:8,padding:"9px",fontSize:12,cursor:"pointer",fontWeight:lead.status===s?700:400}}>{s==="Hot"?"🔥":s==="Warm"?"⚡":"❄️"} {s}</button>)}
            </div>
            <div style={{fontSize:11,color:C.sub,textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:9}}>Close Lead</div>
            <div style={{display:"flex",flexDirection:"column",gap:7,marginBottom:16}}>
              {confirmClose==="won"?<div style={{background:`${C.green}10`,border:`1px solid ${C.green}25`,borderRadius:9,padding:"11px 13px"}}><div style={{fontSize:12,color:C.green,marginBottom:8}}>✅ Confirm — Found property with Real-X?</div><div style={{display:"flex",gap:7}}><button onClick={()=>setStatus("Closed - Won")} style={{flex:1,background:C.green,border:"none",color:"#050810",borderRadius:7,padding:"8px",fontSize:12,fontWeight:700,cursor:"pointer"}}>Yes, Close Won</button><button onClick={()=>setConfirmClose(null)} style={{background:"transparent",border:`1px solid ${C.border}`,color:C.sub,borderRadius:7,padding:"8px 12px",fontSize:11,cursor:"pointer"}}>Cancel</button></div></div>:<button onClick={()=>setConfirmClose("won")} style={{background:`${C.green}08`,border:`1px solid ${C.green}22`,color:C.green,borderRadius:8,padding:"10px 14px",fontSize:12,cursor:"pointer",fontWeight:600,textAlign:"left"}}>✅ Closed — Found Property with Us</button>}
              {confirmClose==="comp"?<div style={{background:`${C.red}10`,border:`1px solid ${C.red}25`,borderRadius:9,padding:"11px 13px"}}><div style={{fontSize:12,color:C.red,marginBottom:8}}>❌ Confirm — Lost to another agent?</div><div style={{display:"flex",gap:7}}><button onClick={()=>setStatus("Lost - Competitor")} style={{flex:1,background:C.red,border:"none",color:"#fff",borderRadius:7,padding:"8px",fontSize:12,fontWeight:700,cursor:"pointer"}}>Yes, Mark Lost</button><button onClick={()=>setConfirmClose(null)} style={{background:"transparent",border:`1px solid ${C.border}`,color:C.sub,borderRadius:7,padding:"8px 12px",fontSize:11,cursor:"pointer"}}>Cancel</button></div></div>:<button onClick={()=>setConfirmClose("comp")} style={{background:`${C.red}08`,border:`1px solid ${C.red}20`,color:C.red,borderRadius:8,padding:"10px 14px",fontSize:12,cursor:"pointer",fontWeight:600,textAlign:"left"}}>❌ Lost — Found Property with Another Agent</button>}
              {confirmClose==="ni"?<div style={{background:`${C.dim}20`,border:`1px solid ${C.dim}`,borderRadius:9,padding:"11px 13px"}}><div style={{fontSize:12,color:C.sub,marginBottom:8}}>🚫 Confirm — Mark as not interested?</div><div style={{display:"flex",gap:7}}><button onClick={()=>setStatus("Not Interested")} style={{flex:1,background:C.sub,border:"none",color:"#050810",borderRadius:7,padding:"8px",fontSize:12,fontWeight:700,cursor:"pointer"}}>Yes, Mark</button><button onClick={()=>setConfirmClose(null)} style={{background:"transparent",border:`1px solid ${C.border}`,color:C.sub,borderRadius:7,padding:"8px 12px",fontSize:11,cursor:"pointer"}}>Cancel</button></div></div>:<button onClick={()=>setConfirmClose("ni")} style={{background:`${C.dim}18`,border:`1px solid ${C.dim}`,color:C.sub,borderRadius:8,padding:"10px 14px",fontSize:12,cursor:"pointer",fontWeight:600,textAlign:"left"}}>🚫 Not Interested</button>}
            </div>
          </div>}
          {isClosed&&<div style={{background:`${LSTAT_COL[lead.status]||C.green}08`,border:`1px solid ${LSTAT_COL[lead.status]||C.green}22`,borderRadius:9,padding:"13px",marginBottom:14,textAlign:"center"}}><div style={{fontSize:14,color:LSTAT_COL[lead.status]||C.green,fontWeight:600,marginBottom:4}}>{lead.status}</div><div style={{fontSize:11,color:C.sub,marginBottom:9}}>This lead is closed.</div><button onClick={()=>setStatus("Warm")} style={{background:`${C.amber}12`,border:`1px solid ${C.amber}28`,color:C.amber,borderRadius:7,padding:"7px 14px",fontSize:11,cursor:"pointer"}}>↩ Reopen as Warm</button></div>}
          <div style={{borderTop:`1px solid ${C.border}`,paddingTop:13}}>
            <div style={{fontSize:11,color:C.sub,textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:8}}>Danger Zone</div>
            {!confirmDel?<button onClick={()=>setConfirmDel(true)} style={{background:`${C.red}08`,border:`1px solid ${C.red}20`,color:C.red,borderRadius:8,padding:"8px 14px",fontSize:12,cursor:"pointer"}}>🗑️ Delete This Lead</button>:<div style={{background:`${C.red}10`,border:`1px solid ${C.red}28`,borderRadius:9,padding:"11px 13px"}}><div style={{fontSize:12,color:C.red,marginBottom:8}}>⚠️ Delete {lead.name}? This cannot be undone.</div><div style={{display:"flex",gap:7}}><button onClick={()=>onDelete(lead.id)} style={{flex:1,background:C.red,border:"none",color:"#fff",borderRadius:7,padding:"8px",fontSize:12,fontWeight:700,cursor:"pointer"}}>Delete Permanently</button><button onClick={()=>setConfirmDel(false)} style={{background:"transparent",border:`1px solid ${C.border}`,color:C.sub,borderRadius:7,padding:"8px 12px",fontSize:11,cursor:"pointer"}}>Cancel</button></div></div>}
          </div>
        </div>}
      </div>
      {shareAfterSend&&<ShareModal property={shareAfterSend} leads={[{id:lead.id,name:lead.name,phone:lead.phone,status:lead.status}]} onClose={()=>setShareAfterSend(null)}/>}
    </div>
  );
}

/* LEADS */
function Leads({leads,properties,onUpdate,onDelete,addLead}){
  const [sel,setSel]=useState(null);const [showAdd,setShowAdd]=useState(false);const [filt,setFilt]=useState("All");const [srch,setSrch]=useState("");
  const ct=s=>leads.filter(l=>l.status===s).length;
  const filtered=leads.filter(l=>{const mf=filt==="All"||l.status===filt;const ms=!srch||(l.name+l.phone+(l.req||"")+(l.notes||"")).toLowerCase().includes(srch.toLowerCase());return mf&&ms;});
  const handleUpd=(u)=>{onUpdate(u);setSel(u);};
  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
        <div><div style={{fontSize:20,fontWeight:700,color:C.text,fontFamily:"'Cormorant Garamond',serif"}}>Leads & CRM</div><div style={{fontSize:12,color:C.sub,marginTop:2}}>{leads.length} total · {ct("Hot")} hot · {ct("Closed - Won")} closed won</div></div>
        <button onClick={()=>setShowAdd(true)} style={{background:`${C.green}12`,border:`1px solid ${C.green}28`,color:C.green,borderRadius:8,padding:"8px 14px",fontSize:12,cursor:"pointer",fontWeight:600}}>+ Add Lead</button>
      </div>
      {/* Status cards */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:8,marginBottom:13}}>
        {[["🔥 Hot",C.red,"Hot"],["⚡ Warm",C.amber,"Warm"],["❄️ Cold",C.blue,"Cold"],["✅ Won",C.green,"Closed - Won"],["❌ Lost",C.sub,"Lost - Competitor"]].map(([l,col,f])=>(
          <div key={l} onClick={()=>setFilt(filt===f?"All":f)} style={{background:filt===f?`${col}14`:C.card,border:`1px solid ${filt===f?col:C.border}`,borderRadius:9,padding:"9px 11px",cursor:"pointer",transition:"all 0.15s"}}>
            <div style={{fontSize:9,color:C.sub,marginBottom:3}}>{l}</div>
            <div style={{fontSize:21,fontWeight:700,color:col}}>{ct(f)}</div>
          </div>
        ))}
      </div>
      {/* Search */}
      <div style={{position:"relative",marginBottom:10}}><span style={{position:"absolute",left:11,top:"50%",transform:"translateY(-50%)",fontSize:13,color:C.sub,pointerEvents:"none"}}>🔍</span><input value={srch} onChange={e=>setSrch(e.target.value)} placeholder="Search leads by name, phone, requirement..." style={{...INP,paddingLeft:32}}/>{srch&&<button onClick={()=>setSrch("")} style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",background:"transparent",border:"none",color:C.sub,cursor:"pointer",fontSize:14}}>✕</button>}</div>
      {/* Table */}
      <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,overflow:"hidden"}}>
        <div style={{display:"grid",gridTemplateColumns:"2fr 1.3fr 2fr 1fr 1fr 0.7fr",padding:"9px 15px",borderBottom:`1px solid ${C.border}`}}>
          {["Lead","Phone","Requirement","Budget","Status","Sent"].map(h=><div key={h} style={{fontSize:10,color:C.sub,fontWeight:600,textTransform:"uppercase",letterSpacing:"0.5px"}}>{h}</div>)}
        </div>
        {filtered.length===0&&<div style={{padding:"26px",textAlign:"center",fontSize:12,color:C.sub}}>{leads.length===0?"No leads yet — add your first one!":"No leads match."}</div>}
        {filtered.map((lead,i)=>{
          const closed=["Closed - Won","Lost - Competitor","Not Interested"].includes(lead.status);
          return(
            <div key={lead.id} onClick={()=>setSel(sel?.id===lead.id?null:lead)} style={{display:"grid",gridTemplateColumns:"2fr 1.3fr 2fr 1fr 1fr 0.7fr",padding:"10px 15px",cursor:"pointer",borderBottom:i<filtered.length-1?`1px solid ${C.border}`:"none",background:sel?.id===lead.id?`${C.gold}06`:closed?`${C.dim}06`:"transparent",opacity:closed?0.65:1,transition:"background 0.1s"}}>
              <div><div style={{fontSize:12,color:C.text,fontWeight:500}}>{lead.name}</div><div style={{fontSize:10,color:C.sub}}>via {lead.src} · {lead.last}</div></div>
              <div style={{fontSize:11,color:C.sub,display:"flex",alignItems:"center"}}>{lead.phone}</div>
              <div style={{fontSize:11,color:C.text,display:"flex",alignItems:"center",paddingRight:7}}>{lead.req||"—"}</div>
              <div style={{fontSize:11,color:C.gold,display:"flex",alignItems:"center",fontWeight:600}}>{lead.budget||"—"}</div>
              <div style={{display:"flex",alignItems:"center"}}><StBadge status={lead.status}/></div>
              <div style={{fontSize:11,color:C.blue,display:"flex",alignItems:"center",fontWeight:600}}>{(lead.propsSent||[]).length} 🏠</div>
            </div>
          );
        })}
      </div>
      {sel&&<LeadPanel lead={sel} properties={properties} onUpdate={handleUpd} onDelete={(id)=>{onDelete(id);setSel(null);}} onClose={()=>setSel(null)}/>}
      {showAdd&&<AddLeadModal onSave={addLead} onClose={()=>setShowAdd(false)}/>}
    </div>
  );
}

/* ROOT */
export default function RealXCRM(){
  const [tab,setTab]=useState("dashboard");
  const [properties,setProperties]=useState([]);
  const [leads,setLeads]=useState([]);
  const [ready,setReady]=useState(false);
  useEffect(()=>{(async()=>{const p=await loadS("rx_props",[]);const l=await loadS("rx_leads",[]);const fp=p.length?p:SP;const fl=l.length?l:SL;setProperties(fp);setLeads(fl);if(!p.length)await saveS("rx_props",SP);if(!l.length)await saveS("rx_leads",SL);setReady(true);})();},[]);
  const addProp=async(p)=>{const n={...p,id:Date.now(),added:"Just now",hot:false};const u=[n,...properties];setProperties(u);await saveS("rx_props",u);};
  const addLead=async(l)=>{const n={...l,id:Date.now(),last:"Just now",props:0,activities:[{id:Date.now(),type:"contact",text:`New lead added. Req: ${l.req||"Not set"}`,time:tsNow()}],propsSent:[],reqHistory:[{req:l.req||"",budget:l.budget||"",date:new Date().toLocaleDateString("en-IN")}]};const u=[n,...leads];setLeads(u);await saveS("rx_leads",u);};
  const updateLead=async(upd)=>{const u=leads.map(l=>l.id===upd.id?upd:l);setLeads(u);await saveS("rx_leads",u);};
  const deleteLead=async(id)=>{const u=leads.filter(l=>l.id!==id);setLeads(u);await saveS("rx_leads",u);};
  if(!ready)return(<div style={{display:"flex",height:"100vh",alignItems:"center",justifyContent:"center",background:"#06080D"}}><div style={{textAlign:"center"}}><div style={{fontSize:22,color:"#C9A44A",fontWeight:700,marginBottom:7,fontFamily:"serif"}}>Real-X Hyderabad</div><div style={{fontSize:12,color:"#7A7570"}}>Loading...</div></div></div>);
  return(
    <div style={{display:"flex",height:"100vh",background:"#06080D",color:"#EDE8DB",overflow:"hidden"}}>
      <style>{`@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@400;600;700&display=swap');*{box-sizing:border-box;margin:0;padding:0;}::-webkit-scrollbar{width:3px;height:3px;}::-webkit-scrollbar-thumb{background:rgba(201,164,74,0.22);border-radius:2px;}::-webkit-scrollbar-track{background:transparent;}button,input,textarea,select{font-family:'Outfit',sans-serif;}select option{background:#0C0F18;color:#EDE8DB;}`}</style>
      <Sidebar tab={tab} setTab={setTab} pc={properties.length} lc={leads.length}/>
      <main style={{flex:1,overflowY:"auto",padding:"20px 22px",fontFamily:"'Outfit',sans-serif"}}>
        {tab==="dashboard"&&<Dashboard properties={properties} leads={leads}/>}
        {tab==="properties"&&<Properties properties={properties} leads={leads} addProp={addProp}/>}
        {tab==="search"&&<AISearch properties={properties} leads={leads}/>}
        {tab==="whatsapp"&&<WhatsAppBot addProp={addProp}/>}
        {tab==="leads"&&<Leads leads={leads} properties={properties} onUpdate={updateLead} onDelete={deleteLead} addLead={addLead}/>}
      </main>
    </div>
  );
}

  </script>
</body>
</html>
